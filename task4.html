<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Lab Task 04: HTML Forms, Input Types, Fieldset, and Legend">
    <title>Lab Task 04 - HTML Forms</title>
</head>

<body>

    <h1>Lab Task 04: HTML Forms, Input Types, Fieldset, and Legend</h1>

    <form action="#" method="post">

        <fieldset>
            <legend>Personal Information</legend>

            <p>
                <label for="fullname">Full Name:</label><br>
                <input type="text" id="fullname" name="fullname" required>
            </p>

            <p>
                <label for="email">Email Address:</label><br>
                <input type="email" id="email" name="email" required>
            </p>

            <p>
                <label for="password">Password:</label><br>
                <input type="password" id="password" name="password" required>
            </p>

            <p>
                <label for="dob">Date of Birth:</label><br>
                <input type="date" id="dob" name="dob">
            </p>

            <p>
                Gender:<br>
                <label for="gender_male">
                    <input type="radio" id="gender_male" name="gender" value="male">
                    Male
                </label><br>

                <label for="gender_female">
                    <input type="radio" id="gender_female" name="gender" value="female">
                    Female
                </label><br>

                <label for="gender_other">
                    <input type="radio" id="gender_other" name="gender" value="other">
                    Other
                </label>
            </p>
        </fieldset>

        <fieldset>
            <legend>Academic Information</legend>

            <p>
                <label for="department">Department:</label><br>
                <select id="department" name="department">
                    <option value="">-- Select Department --</option>
                    <option value="cse">CSE</option>
                    <option value="eee">EEE</option>
                    <option value="bba">BBA</option>
                    <option value="eng">English</option>
                </select>
            </p>

            <p>
                Skills:<br>
                <label for="skill_html">
                    <input type="checkbox" id="skill_html" name="skills" value="html">
                    HTML
                </label><br>

                <label for="skill_css">
                    <input type="checkbox" id="skill_css" name="skills" value="css">
                    CSS
                </label><br>

                <label for="skill_js">
                    <input type="checkbox" id="skill_js" name="skills" value="javascript">
                    JavaScript
                </label><br>

                <label for="skill_python">
                    <input type="checkbox" id="skill_python" name="skills" value="python">
                    Python
                </label>
            </p>
        </fieldset>

        <p>
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
        </p>

    </form>

</body>
</html>
